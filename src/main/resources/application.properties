spring.application.name=vc-compass

#Database (Supabase Postgres) =====
spring.datasource.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.lltpgxdjslbpzzehgdvc
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fixes potential prepared-statement caching issues with Supabase's pooler
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JWT / Security
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ElevenLabs
elevenlabs.api.key=${ELEVENLABS_API_KEY}
elevenlabs.api.base-url=https://api.elevenlabs.io

# Server
server.port=8080

anthropic.api-key=${ANTHROPIC_API_KEY}
